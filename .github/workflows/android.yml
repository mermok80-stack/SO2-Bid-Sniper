name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SO2_Bid_Sniper_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          echo "=== Содержимое репозитория ==="
          ls -la
          unzip -o SO2_Bid_Sniper_Android_Project.zip
          echo "=== После распаковки ==="
          ls -la
          find . -name "build.gradle*" -o -name "settings.gradle*" | head -20

      - name: Determine project path
        id: project
        run: |
          if [ -d "SO2_Bid_Sniper" ]; then
            echo "path=SO2_Bid_Sniper" >> $GITHUB_OUTPUT
          elif [ -d "SO2_Bid_Sniper_Android_Project" ]; then
            echo "path=SO2_Bid_Sniper_Android_Project" >> $GITHUB_OUTPUT
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            PROJECT_DIR=$(find . -name "settings.gradle*" -type f | head -1 | xargs dirname)
            echo "path=$PROJECT_DIR" >> $GITHUB_OUTPUT
          fi
          echo "Проект найден в: $(cat $GITHUB_OUTPUT)"

      - name: Make gradlew executable
        run: |
          cd "${{ steps.project.outputs.path }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SO2-Bid-Sniper-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
